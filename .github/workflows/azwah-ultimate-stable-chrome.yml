name: AZWAH Windows installer acceptance
on:
  push:
    branches: [main, release/azwah-windows, hardening/azwah-windows-reliability, feature/azwah-ultimate-2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/azwah-windows' || github.ref == 'refs/heads/hardening/azwah-windows-reliability' || github.ref == 'refs/heads/feature/azwah-ultimate-2'
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      # Rebuild the pinned predecessor for the upgrade test so artifact expiry cannot break CI.
      AZWAH_UPGRADE_BASELINE: '4a45831209cbf603ff9328a086f8f5f7ad5dd118'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tracked release source for common credential formats
        shell: bash
        run: |
          set +e
          git grep -I -l -E -e '-----BEGIN (RSA |EC |OPENSSH |ENCRYPTED )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{40,}|AKIA[A-Z0-9]{16}' -- .
          status=$?
          if [ "$status" -ne 1 ]; then
            echo "Credential pattern matched or scan failed. Review matching filenames before merging."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and verify installed Chrome Stable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node --input-type=module -e "import {resolveWindowsChromeStable as detect} from './server/browser-runtime/chrome-stable.js'; console.log((await detect()).version)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw 'Chrome Stable version verification failed.' }
          "AZWAH_ACCEPTANCE_CHROME=$version" | Add-Content $env:GITHUB_ENV
          Write-Output "Signed Chrome Stable x64 $version"
      - name: Unit and security checks
        shell: pwsh
        run: |
          npx playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:security
          exit $LASTEXITCODE
      - name: Stable Chrome and migration tests
        shell: pwsh
        run: |
          node --test test/update-download.test.js test/tab-restore.test.js test/launch-memory-threshold.test.js test/dbip-location.test.js test/privacy-evidence.test.js test/chrome-stable.test.js test/proxy-location.test.js test/ultimate-migrate.test.js test/windows-owner-snapshot.test.js test/windows-owner-secrets.test.js test/termination-evidence.test.js test/m17-crash-recovery.test.js test/backup.test.js test/backup-encrypted.test.js test/portable-purge-crash.test.js test/release-updates.test.js
          exit $LASTEXITCODE
      - name: Build Office payload and Ultimate NSIS without a Chrome binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          choco install nsis -y --no-progress
          node scripts/fetch-bundled-firefox.mjs
          node scripts/fetch-dbip-lite.mjs
          npx electron-builder install-app-deps --arch=x64
          $env:VITE_AZWAH_ADMIN = '0'
          npm run build
          npx electron-builder --config electron-builder.office-stable-payload.cjs --win --dir --x64 --publish never
          $env:VITE_AZWAH_ADMIN = '1'
          npm run build
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item "${env:ProgramFiles(x86)}\NSIS" build/admin-nsis -Recurse
          npx electron-builder --config electron-builder.ultimate-stable.cjs --win nsis --x64 --publish never
      - name: Record installer provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'release-ultimate-stable'
          $name = 'Azwah-Setup-x64.exe'
          $exe = Get-Item (Join-Path $dir $name)
          $hash = (Get-FileHash -LiteralPath $exe.FullName).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content (Join-Path $dir 'SHA256SUMS.txt')
          $label = if ($env:GITHUB_REF -eq 'refs/heads/hardening/azwah-windows-reliability') { 'AZWAH Windows Beta — Reliability Hardening' } else { 'AZWAH Windows' }
          $version = node -p "require('./electron-builder.ultimate-stable.cjs').extraMetadata.version"
          if ($LASTEXITCODE -ne 0 -or !$version) { throw 'Installer version metadata is missing.' }
          $manifest = @($label, "Version: $version", "Source: $env:GITHUB_SHA", "Bytes: $($exe.Length)", "SHA-256: $hash",
            "Browser: external, signed Google Chrome Stable x64 $env:AZWAH_ACCEPTANCE_CHROME", 'Host: Windows Server 2022',
            'Windows 10/11 client acceptance: pending', 'Unsigned installer candidate')
          $manifest | Set-Content (Join-Path $dir 'BUILD-MANIFEST.txt')
          $manifest | Add-Content $env:GITHUB_STEP_SUMMARY
          $manifest | Write-Output
      - name: Install, launch Chrome Stable, stop and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'azwah-stable-install'
          $installer = Resolve-Path 'release-ultimate-stable/Azwah-Setup-x64.exe'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$dir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed with exit $($setup.ExitCode)" }
          $app = Join-Path $dir 'AZWAH.exe'
          $env:PM_SMOKE = '1'
          $env:PM_SMOKE_RESULT = Join-Path $env:RUNNER_TEMP 'azwah-stable-smoke.json'
          $env:PM_SMOKE_VISUAL_DIR = Join-Path $env:RUNNER_TEMP 'azwah-installed-visuals'
          $env:PM_USER_DATA = Join-Path $env:RUNNER_TEMP 'azwah-stable-smoke-data'
          $process = Start-Process -FilePath $app -PassThru
          try {
            if (!$process.WaitForExit(240000)) { throw 'Installed app smoke timed out.' }
            $result = Get-Content -Raw $env:PM_SMOKE_RESULT | ConvertFrom-Json
            if ($process.ExitCode -ne 0 -or !$result.chromeStable -or !$result.stopped) { throw ($result | ConvertTo-Json) }
            $result | ConvertTo-Json
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          $uninstaller = Get-ChildItem -LiteralPath $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw 'Uninstaller missing.' }
          $removed = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($removed.ExitCode -ne 0 -or (Test-Path $app) -or !(Test-Path $env:PM_USER_DATA)) { throw 'Uninstall or data retention check failed.' }
      - name: Qualify installed first run, profile storage, recovery and working sets
        shell: pwsh
        timeout-minutes: 15
        run: node scripts/windows-qualification/fresh-install.mjs
      - name: Test concurrent Chrome isolation, timezone, geolocation and failed proxy
        shell: pwsh
        run: |
          node --test --test-force-exit test/chrome-stable-windows-live.test.js test/chrome-stable-network-windows.test.js test/chrome-stable-dbip-windows.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PM_TEST_SOCKS5 = '1'
          node --test --test-force-exit test/chrome-stable-dbip-windows.test.js
          exit $LASTEXITCODE
      - name: Check out the pinned upgrade baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ env.AZWAH_UPGRADE_BASELINE }}
          path: prior-source
          persist-credentials: false
      - name: Build the pinned upgrade baseline
        shell: pwsh
        working-directory: prior-source
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $source = git rev-parse HEAD
          if ($source -ne $env:AZWAH_UPGRADE_BASELINE) { throw 'Upgrade baseline source mismatch.' }
          npm ci --no-audit --no-fund
          node scripts/fetch-bundled-firefox.mjs
          npx electron-builder install-app-deps --arch=x64
          $env:VITE_AZWAH_ADMIN = '0'
          npm run build
          npx electron-builder --config electron-builder.office-stable-payload.cjs --win --dir --x64 --publish never
          $env:VITE_AZWAH_ADMIN = '1'
          npm run build
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item "${env:ProgramFiles(x86)}\NSIS" build/admin-nsis -Recurse
          npx electron-builder --config electron-builder.ultimate-stable.cjs --win nsis --x64 --publish never
          $dir = 'release-ultimate-stable'
          $name = 'Azwah-Ultimate-Stable-Chrome-Setup-x64.exe'
          $hash = (Get-FileHash -LiteralPath (Join-Path $dir $name)).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content (Join-Path $dir 'SHA256SUMS.txt')
          Write-Output "Rebuilt upgrade baseline: source=$source SHA-256=$hash"
      - name: Verify in-place upgrade and preserve the profile database
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PM_SMOKE = '1'
          $env:PM_USER_DATA = Join-Path $env:RUNNER_TEMP 'azwah-upgrade-data'
          $dir = Join-Path $env:RUNNER_TEMP 'azwah-upgrade-install'
          $db = Join-Path $env:PM_USER_DATA 'data/profiles.db'
          function ProfileIds {
            node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; const db=new DatabaseSync(process.argv[1],{readOnly:true}); for(const r of db.prepare('SELECT id FROM profiles ORDER BY id').all()) console.log(r.id)" $db
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect installed profile database.' }
          }
          function InstallAndSmoke($folder, $name, $appName, $expectedHash) {
            $app = Join-Path $dir $appName
            $exe = Resolve-Path (Join-Path $folder $name)
            $actual = (Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant()
            if ($actual -ne $expectedHash) { throw 'Installer SHA-256 mismatch.' }
            Write-Output "$folder EXE SHA256=$actual"
            $setup = Start-Process -FilePath $exe -ArgumentList @('/S', "/D=$dir") -Wait -PassThru
            if ($setup.ExitCode -ne 0) { throw 'Install or upgrade failed.' }
            $env:PM_SMOKE_RESULT = Join-Path $env:RUNNER_TEMP "$name-smoke.json"
            $proc = Start-Process -FilePath $app -PassThru
            try {
              if (!$proc.WaitForExit(120000)) { throw 'Installed Chrome smoke timed out.' }
              $smoke = Get-Content -Raw $env:PM_SMOKE_RESULT | ConvertFrom-Json
              if ($proc.ExitCode -ne 0 -or !$smoke.chromeStable -or !$smoke.stopped) { throw 'Installed Chrome smoke failed.' }
            } finally { if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force } }
          }
          $prior = 'prior-source/release-ultimate-stable'
          $priorHash = ((Get-Content -Raw (Join-Path $prior 'SHA256SUMS.txt')).Trim() -split '\s+')[0]
          InstallAndSmoke $prior 'Azwah-Ultimate-Stable-Chrome-Setup-x64.exe' 'Azwah Multi Browser Ultimate.exe' $priorHash
          $priorIds = @(ProfileIds)
          if ($priorIds.Count -lt 1) { throw 'Prior installation did not create a profile.' }
          $expected = ((Get-Content -Raw 'release-ultimate-stable/SHA256SUMS.txt').Trim() -split '\s+')[0]
          InstallAndSmoke release-ultimate-stable 'Azwah-Setup-x64.exe' 'AZWAH.exe' $expected
          $nextIds = @(ProfileIds)
          if ($nextIds.Count -le $priorIds.Count -or @($priorIds | Where-Object { $_ -notin $nextIds }).Count) {
            throw 'Existing profile IDs were lost during upgrade.'
          }
          $uninstaller = Get-ChildItem -LiteralPath $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw 'Missing uninstaller.' }
          $removed = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($removed.ExitCode -ne 0 -or (Test-Path (Join-Path $dir 'AZWAH.exe')) -or !(Test-Path $db)) { throw 'Uninstall retention failed.' }
          $after = @(ProfileIds)
          if (Compare-Object $nextIds $after) { throw 'Uninstall changed the profile IDs.' }
          Write-Output 'PASS Windows Server 2022: both installer checksums, fresh install, in-place upgrade, Chrome launch/stop, uninstall, profile database retention.'
      - name: Verify in-place upgrade on the default data location with populated data
        shell: pwsh
        timeout-minutes: 25
        run: node scripts/windows-qualification/upgrade-in-place.mjs
      - name: Build Beta B installer for the online update test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npx electron-builder --config electron-builder.ultimate-update-test.cjs --win nsis --x64 --publish never
          $b = Get-Item 'release-update-b/Azwah-Setup-x64.exe'
          Write-Output "Beta B 2.0.0-beta.2 bytes=$($b.Length) SHA-256=$((Get-FileHash -LiteralPath $b.FullName).Hash.ToLowerInvariant())"
      - name: Verify online update Beta A to Beta B with preserved profile data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PM_SMOKE = '1'
          $env:PM_USER_DATA = Join-Path $env:RUNNER_TEMP 'azwah-update-data'
          $dir = Join-Path $env:RUNNER_TEMP 'azwah-update-install'
          $app = Join-Path $dir 'AZWAH.exe'
          $db = Join-Path $env:PM_USER_DATA 'data/profiles.db'
          $a = Resolve-Path 'release-ultimate-stable/Azwah-Setup-x64.exe'
          $b = Resolve-Path 'release-update-b/Azwah-Setup-x64.exe'
          $bHash = (Get-FileHash -LiteralPath $b).Hash.ToLowerInvariant()
          function ProfileIds {
            node --input-type=module -e "import {DatabaseSync} from 'node:sqlite'; const db=new DatabaseSync(process.argv[1],{readOnly:true}); for(const r of db.prepare('SELECT id FROM profiles ORDER BY id').all()) console.log(r.id)" $db
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect installed profile database.' }
          }
          function RunApp($name, [hashtable]$extra = @{}) {
            $env:PM_SMOKE_RESULT = Join-Path $env:RUNNER_TEMP "$name.json"
            if (Test-Path $env:PM_SMOKE_RESULT) { Remove-Item $env:PM_SMOKE_RESULT }
            foreach ($k in $extra.Keys) { Set-Item "env:$k" $extra[$k] }
            try {
              $proc = Start-Process -FilePath $app -PassThru
              if (!$proc.WaitForExit(180000)) { Stop-Process -Id $proc.Id -Force; throw "$name timed out." }
              $result = Get-Content -Raw $env:PM_SMOKE_RESULT | ConvertFrom-Json
              if ($proc.ExitCode -ne 0) { throw "$name exited $($proc.ExitCode): $($result | ConvertTo-Json -Depth 5)" }
              # Write-Host, not Write-Output: anything written to the output stream would become part
              # of the return value and turn $result into an array, making -ne checks vacuous.
              Write-Host "$name $($result | ConvertTo-Json -Depth 5 -Compress)"
              return $result
            } finally { foreach ($k in $extra.Keys) { Remove-Item "env:$k" -ErrorAction SilentlyContinue } }
          }
          function StartFeed($name, [switch]$Tamper) {
            $info = Join-Path $env:RUNNER_TEMP "$name-feed.json"
            $feedArgs = @('scripts/update-feed-fixture.mjs', '--installer', "$b", '--version', '2.0.0-beta.2', '--previous', '2.0.0-beta.1', '--port-file', $info)
            if ($Tamper) { $feedArgs += '--tamper' }
            $proc = Start-Process -FilePath node -ArgumentList $feedArgs -PassThru -NoNewWindow
            for ($i = 0; $i -lt 100 -and !(Test-Path $info); $i++) { Start-Sleep -Milliseconds 100 }
            if (!(Test-Path $info)) { throw "$name feed did not start." }
            return @{ proc = $proc; info = (Get-Content -Raw $info | ConvertFrom-Json) }
          }
          function Need($object, [string[]]$paths) {
            if ($object -is [array]) { throw 'Smoke result must be a single object.' }
            foreach ($p in $paths) {
              $value = $object
              foreach ($part in $p.Split('.')) { $value = $value.$part }
              if ($null -eq $value -or "$value" -eq '') { throw "Smoke result is missing $p." }
            }
          }
          # 1. Install Beta A and create profile data with a real Chrome launch.
          $setup = Start-Process -FilePath $a -ArgumentList @('/S', "/D=$dir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Beta A install failed.' }
          $smokeA = RunApp 'update-beta-a'
          Need $smokeA @('chromeStable', 'version')
          if (!$smokeA.chromeStable -or $smokeA.version -ne '2.0.0-beta.1') { throw 'Beta A smoke failed.' }
          $idsA = @(ProfileIds)
          if ($idsA.Count -lt 1) { throw 'Beta A created no profile.' }
          # 2. A tampered release digest must be refused by Beta A's updater.
          $bad = StartFeed 'tampered' -Tamper
          try {
            $refused = RunApp 'update-check-tampered' @{ PM_SMOKE_UPDATE = '1'; PM_SMOKE_UPDATE_ORIGIN = $bad.info.origin }
            Need $refused @('status', 'download.status', 'download.error')
            if ($refused.status -ne 'available' -or $refused.download.status -ne 'failed' -or $refused.download.error -notmatch 'integrity') { throw 'Tampered installer was not refused.' }
          } finally { Stop-Process -Id $bad.proc.Id -Force -ErrorAction SilentlyContinue }
          # 3. Beta A's real updater finds Beta B, downloads it and verifies size and SHA-256.
          $good = StartFeed 'good'
          try {
            $update = RunApp 'update-check' @{ PM_SMOKE_UPDATE = '1'; PM_SMOKE_UPDATE_ORIGIN = $good.info.origin }
          } finally { Stop-Process -Id $good.proc.Id -Force -ErrorAction SilentlyContinue }
          Need $update @('installedVersion', 'status', 'latest.version', 'latest.sha256', 'download.status', 'download.file')
          if ($update.installedVersion -ne '2.0.0-beta.1' -or $update.status -ne 'available' -or $update.latest.version -ne '2.0.0-beta.2') { throw 'Beta A did not offer Beta B.' }
          if ($update.download.status -ne 'verified' -or $update.latest.sha256 -ne $bHash) { throw 'Beta B download was not verified.' }
          $downloaded = $update.download.file
          if ((Get-FileHash -LiteralPath $downloaded).Hash.ToLowerInvariant() -ne $bHash) { throw 'Downloaded installer differs from Beta B.' }
          # 4. Run the downloaded, verified installer over Beta A, then launch Beta B.
          $upgrade = Start-Process -FilePath $downloaded -ArgumentList @('/S', "/D=$dir") -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw 'Upgrade with the downloaded installer failed.' }
          $smokeB = RunApp 'update-beta-b'
          Need $smokeB @('chromeStable', 'version')
          if (!$smokeB.chromeStable -or $smokeB.version -ne '2.0.0-beta.2') { throw "Beta B did not start as 2.0.0-beta.2: $($smokeB.version)" }
          $idsB = @(ProfileIds)
          $lost = @($idsA | Where-Object { $_ -notin $idsB })
          if ($lost.Count) { throw "Profiles lost during the online update: $($lost -join ', ')" }
          # 5. Beta B sees no newer release in the same feed.
          $good = StartFeed 'good-after'
          try {
            $after = RunApp 'update-check-after' @{ PM_SMOKE_UPDATE = '1'; PM_SMOKE_UPDATE_ORIGIN = $good.info.origin }
          } finally { Stop-Process -Id $good.proc.Id -Force -ErrorAction SilentlyContinue }
          Need $after @('installedVersion', 'status')
          if ($after.installedVersion -ne '2.0.0-beta.2' -or $after.status -ne 'current') { throw 'Beta B still offered an update.' }
          $summary = "PASS online update: Beta A $($update.installedVersion) -> Beta B $($smokeB.version) via the shipping updater (loopback release fixture). Downloaded $($update.latest.size) bytes, SHA-256 $($update.latest.sha256); tampered digest refused ($($refused.download.error)); $($idsA.Count) of $($idsA.Count) profile id(s) preserved ($($idsB.Count) after B's own smoke); Beta B launched Chrome Stable and then reported status '$($after.status)'."
          $summary | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Output $summary
      - name: Upload installed layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azwah-installed-layout-${{ github.sha }}
          path: ${{ runner.temp }}/azwah-installed-visuals
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: azwah-windows-x64-${{ github.sha }}
          path: |
            release-ultimate-stable/Azwah-Setup-x64.exe
            release-ultimate-stable/SHA256SUMS.txt
            release-ultimate-stable/BUILD-MANIFEST.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Read back the uploaded installer
        uses: actions/download-artifact@v4
        with:
          name: azwah-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/azwah-readback
      - name: Verify distributed installer against build provenance
        shell: pwsh
        run: |
          $file = Get-Item (Join-Path $env:RUNNER_TEMP 'azwah-readback/Azwah-Setup-x64.exe')
          $built = Get-Item 'release-ultimate-stable/Azwah-Setup-x64.exe'
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($file.Length -ne $built.Length -or $hash -ne (Get-FileHash $built.FullName).Hash.ToLowerInvariant()) { throw 'CI artifact differs from the tested installer.' }
          Write-Output "INSTALLER_READBACK source=$env:GITHUB_SHA bytes=$($file.Length) sha256=$hash"
