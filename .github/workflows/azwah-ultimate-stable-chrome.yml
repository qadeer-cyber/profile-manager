name: Azwah Ultimate Stable Chrome Windows installer
on:
  push:
    branches: [release/azwah-ultimate-stable-chrome]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/release/azwah-ultimate-stable-chrome'
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and verify installed Chrome Stable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --input-type=module -e "import {resolveWindowsChromeStable as detect} from './server/browser-runtime/chrome-stable.js'; console.log(await detect())"
          exit $LASTEXITCODE
      - name: Stable Chrome and migration tests
        shell: pwsh
        run: |
          node --test test/chrome-stable.test.js test/proxy-location.test.js test/ultimate-migrate.test.js test/windows-owner-snapshot.test.js test/windows-owner-secrets.test.js
          exit $LASTEXITCODE
      - name: Build Office payload and Ultimate NSIS without a Chrome binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          choco install nsis -y --no-progress
          node scripts/fetch-bundled-firefox.mjs
          npx electron-builder install-app-deps --arch=x64
          $env:VITE_AZWAH_ADMIN = '0'
          npm run build
          npx electron-builder --config electron-builder.office-stable-payload.cjs --win --dir --x64 --publish never
          $env:VITE_AZWAH_ADMIN = '1'
          npm run build
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item "${env:ProgramFiles(x86)}\NSIS" build/admin-nsis -Recurse
          npx electron-builder --config electron-builder.ultimate-stable.cjs --win nsis --x64 --publish never
      - name: Record installer provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = 'release-ultimate-stable'
          $name = 'Azwah-Ultimate-Stable-Chrome-Setup-x64.exe'
          $exe = Get-Item (Join-Path $dir $name)
          $hash = (Get-FileHash -LiteralPath $exe.FullName).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content (Join-Path $dir 'SHA256SUMS.txt')
          $manifest = @("Source: $env:GITHUB_SHA", "Bytes: $($exe.Length)", "SHA-256: $hash",
            'Browser: external, signed Google Chrome Stable x64', 'Host: Windows Server 2022',
            'Windows 10/11 client acceptance: pending', 'Unsigned installer candidate')
          $manifest | Set-Content (Join-Path $dir 'BUILD-MANIFEST.txt')
          $manifest | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: azwah-ultimate-stable-chrome-x64-${{ github.sha }}
          path: |
            release-ultimate-stable/Azwah-Ultimate-Stable-Chrome-Setup-x64.exe
            release-ultimate-stable/SHA256SUMS.txt
            release-ultimate-stable/BUILD-MANIFEST.txt
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Install, launch Chrome Stable, stop and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'azwah-stable-install'
          $installer = Resolve-Path 'release-ultimate-stable/Azwah-Ultimate-Stable-Chrome-Setup-x64.exe'
          $setup = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$dir") -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Setup failed with exit $($setup.ExitCode)" }
          $app = Join-Path $dir 'Azwah Multi Browser Ultimate.exe'
          $env:PM_SMOKE = '1'
          $env:PM_SMOKE_RESULT = Join-Path $env:RUNNER_TEMP 'azwah-stable-smoke.json'
          $env:PM_USER_DATA = Join-Path $env:RUNNER_TEMP 'azwah-stable-smoke-data'
          $process = Start-Process -FilePath $app -PassThru
          try {
            if (!$process.WaitForExit(120000)) { throw 'Installed app smoke timed out.' }
            $result = Get-Content -Raw $env:PM_SMOKE_RESULT | ConvertFrom-Json
            if ($process.ExitCode -ne 0 -or !$result.chromeStable -or !$result.stopped) { throw ($result | ConvertTo-Json) }
            $result | ConvertTo-Json
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          $uninstaller = Get-ChildItem -LiteralPath $dir -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (!$uninstaller) { throw 'Uninstaller missing.' }
          $removed = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($removed.ExitCode -ne 0 -or (Test-Path $app) -or !(Test-Path $env:PM_USER_DATA)) { throw 'Uninstall or data retention check failed.' }
      - name: Test live Chrome page timezone, geolocation and restart
        shell: pwsh
        run: |
          node --test --test-force-exit test/chrome-stable-windows-live.test.js
          exit $LASTEXITCODE
