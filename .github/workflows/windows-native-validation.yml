# QA-branch source-only variant of the registered workflow. No installer steps.
name: M2 source acceptance (no installers)
on:
  workflow_dispatch:
    inputs:
      build_installers:
        description: Must remain false; installers are not supported by this workflow version
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  source-tests:
    if: ${{ !inputs.build_installers }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d41eb1c6c5d65fa2f2a3ba861c1a8c509ac50838
          path: .m2/backend
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 5a2aea74ecb4f117b6a05def042726a868033c25
          path: .m2/ui
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble exact M2 source snapshots without merging
        run: node scripts/m2-assemble.mjs
      - name: Install locked source dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium and Linux runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - name: Install pinned Chromium on Windows
        if: runner.os == 'Windows'
        run: npx playwright install chromium
      - name: Run source acceptance under a Linux display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/m2-source-ci.mjs
      - name: Run source acceptance on Windows
        if: runner.os == 'Windows'
        run: node scripts/m2-source-ci.mjs
      - name: Preserve actual source-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-source-evidence-${{ matrix.os }}
          path: .m2/evidence/**
          if-no-files-found: error
          retention-days: 14
