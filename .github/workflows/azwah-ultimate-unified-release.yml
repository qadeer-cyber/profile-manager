name: Azwah Ultimate unified Windows release
on:
  workflow_dispatch:
  push:
    branches: [integration/azwah-ultimate-ui-release]
    paths:
      - server/ultimate-admin.js
      - server/office/edition.js
      - electron/ultimate-migrate.js
      - electron/main.js
      - electron-builder.ultimate-unified.cjs
      - electron-builder.office-payload.cjs
      - scripts/ultimate-before-pack.cjs
      - scripts/fetch-bundled-firefox.mjs
      - test/ultimate-packaging-policy.test.js
permissions:
  contents: read
jobs:
  unified:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build tools without installing Firefox
        shell: pwsh
        run: |
          if (Get-Command firefox -ErrorAction SilentlyContinue) { throw 'This runner already has Firefox; the bundled-runtime test would not be clean.' }
          choco install 7zip nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the employee payload and the single Ultimate installer
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:VITE_AZWAH_ADMIN = '0'
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/fetch-bundled-chromium.mjs win64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/fetch-bundled-firefox.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder install-app-deps --arch=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --config electron-builder.office-payload.cjs --win --dir --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:VITE_AZWAH_ADMIN = '1'
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item "${env:ProgramFiles(x86)}\NSIS" build/admin-nsis -Recurse
          npx electron-builder --config electron-builder.ultimate-unified.cjs --win nsis --x64 --publish never
          exit $LASTEXITCODE
      - name: Record installer provenance before acceptance
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exeName = 'Azwah-Multi-Browser-Ultimate-Setup-x64.exe'
          $dir = 'release-ultimate'
          $exe = Join-Path $dir $exeName
          if (-not (Test-Path -LiteralPath $exe)) { throw "Built installer is missing: $exe" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $exe).Length
          "$hash  $exeName" | Set-Content -Encoding ascii (Join-Path $dir 'SHA256SUMS.txt')
          @(
            "Installer source: $env:GITHUB_SHA"
            "Harness: $env:GITHUB_SHA"
            "Installer: $exeName"
            "Bytes: $size"
            "SHA256: $hash"
            "Product: Azwah Multi Browser Ultimate"
            "Firefox: 153.5.1esr win64 en-US"
            "Firefox installer SHA256: 833147d8124d77331afbc35ef9f85f158dffb633f6d7586ede64f4601131e86c"
            "Host: Windows Server 2022"
            "Windows 10: not qualified"
            "Authenticode: NotSigned"
            "Separate Admin installer: not part of this release"
            "Private keys: not included"
            "Organization vault: not included"
          ) | Set-Content -Encoding ascii (Join-Path $dir 'BUILD-MANIFEST.txt')
      - name: Preserve the built installer before installed acceptance
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-installer-${{ github.sha }}
          path: |
            release-ultimate/Azwah-Multi-Browser-Ultimate-Setup-x64.exe
            release-ultimate/SHA256SUMS.txt
            release-ultimate/BUILD-MANIFEST.txt
          retention-days: 14
          if-no-files-found: error
      - name: Download the previous separate Owner and Admin installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force prior-installers | Out-Null
          gh release download azwah-multi-browser-owner-experimental.1 --repo $env:GITHUB_REPOSITORY --pattern 'Azwah-Multi-Browser-Full-Setup-x64.exe' --dir prior-installers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download azwah-license-admin-experimental.1 --repo $env:GITHUB_REPOSITORY --pattern 'Azwah-License-Admin-Setup-x64.exe' --dir prior-installers
          exit $LASTEXITCODE
      - name: Install and test the unified application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-evidence/ultimate-unified | Out-Null
          node scripts/ultimate-unified-acceptance.mjs 2>&1 | Tee-Object build-evidence/ultimate-unified/transcript.log
          exit $LASTEXITCODE
      - name: Publish the single Ultimate installer after download verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'Azwah-Multi-Browser-Ultimate-Setup-x64.exe'
          $dir = 'release-ultimate'
          $recorded = (Get-Content -LiteralPath (Join-Path $dir 'SHA256SUMS.txt') -Raw).Split(' ')[0].Trim()
          $hash = (Get-FileHash (Join-Path $dir $exe) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $recorded) { throw 'Installer bytes changed after the pre-acceptance manifest was recorded.' }
          $size = (Get-Item (Join-Path $dir $exe)).Length
          $tag = "azwah-multi-browser-ultimate-unified-$($env:GITHUB_SHA.Substring(0,12))"
          $ErrorActionPreference = 'Continue'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists and will not be replaced." }
          $ErrorActionPreference = 'Stop'
          @"
          # Azwah Multi Browser Ultimate

          One installer. Browser management works without employee activation. License administration is a section of this application, not a second program. The employee Office installer is generated locally and is not this download.

          Source: $env:GITHUB_SHA
          Windows Server 2022 evidence: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
          Not Windows 10. Unsigned. Firefox is unmodified Mozilla Firefox ESR 153.5.1 under MPL 2.0. No stealth or anti-detect claim.

          Bytes: $size
          SHA256: $hash
          "@ | Set-Content "$dir/RELEASE-NOTES.md"
          @(
            "Installer source: $env:GITHUB_SHA"
            "Harness: $env:GITHUB_SHA"
            "Installer: $exe"
            "Bytes: $size"
            "SHA256: $hash"
            "Product: Azwah Multi Browser Ultimate"
            "Firefox: 153.5.1esr win64 en-US"
            "Firefox installer SHA256: 833147d8124d77331afbc35ef9f85f158dffb633f6d7586ede64f4601131e86c"
            "Host: Windows Server 2022"
            "Windows 10: not qualified"
            "Authenticode: NotSigned"
            "Separate Admin installer: not part of this release"
            "Private keys: not included"
            "Organization vault: not included"
          ) | Set-Content "$dir/BUILD-MANIFEST.txt"
          gh release create $tag "$dir/$exe" "$dir/SHA256SUMS.txt" "$dir/BUILD-MANIFEST.txt" "$dir/RELEASE-NOTES.md" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "Azwah Multi Browser Ultimate $tag" --notes-file "$dir/RELEASE-NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed. Existing releases were not changed.' }
          $verify = Join-Path $env:RUNNER_TEMP 'ultimate-unified-download'
          New-Item -ItemType Directory -Force $verify | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $exe --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Draft download failed. Release remains draft.' }
          if ((Get-FileHash (Join-Path $verify $exe) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Uploaded EXE checksum mismatch. Release remains draft.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
      - name: Preserve unified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-unified-${{ github.sha }}
          path: build-evidence/ultimate-unified
          retention-days: 30
