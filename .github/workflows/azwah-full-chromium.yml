name: Azwah full Chromium build
on:
  push:
    branches: [engineering/azwah-integrated-engine]
    paths: [.github/workflows/azwah-full-chromium.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: azwah-full-chromium
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/engineering/azwah-integrated-engine' }}
    runs-on: windows-2025
    timeout-minutes: 340
    outputs:
      linked: ${{ steps.compile.outputs.linked }}
      resume: ${{ steps.compile.outputs.resume }}
      checkpoint: ${{ steps.upload.outputs.artifact-id }}
    steps: &build_steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare and verify the pinned Windows toolchain
        shell: pwsh
        run: ./scripts/prepare-native-windows-sdk.ps1 -Workspace $env:GITHUB_WORKSPACE
      - name: Checkout pinned depot_tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) 'azwah-checkpoint'
          $tools = Join-Path $root 'depot_tools'
          $workspace = Join-Path $root 'chromium'
          $pin = '96a7c1418eedaa6bea333a8941e8a0078681b4d0'
          New-Item -ItemType Directory -Path $tools,$workspace | Out-Null
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git -C $tools init --quiet
          git -C $tools remote add origin https://chromium.googlesource.com/chromium/tools/depot_tools.git
          git -C $tools fetch --no-tags --depth=1 origin $pin
          if ($LASTEXITCODE -ne 0) { throw 'Pinned depot_tools fetch failed.' }
          git -C $tools checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git -C $tools rev-parse HEAD) -ne $pin) { throw 'depot_tools pin did not verify.' }
          @("AZWAH_BUILD_WORKSPACE=$workspace", "AZWAH_DEPOT_TOOLS=$tools", "AZWAH_DEPOT_TOOLS_SHA=$pin") | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Initialize and qualify pinned depot_tools Python before Chromium sync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/qualify-native-depot-tools.ps1 -DepotTools $env:AZWAH_DEPOT_TOOLS -ExpectedCommit $env:AZWAH_DEPOT_TOOLS_SHA
      - name: Verify pinned Mozilla sccache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest 'https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash -ine '28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1') {
            throw 'sccache release checksum mismatch.'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'sccache'
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $exe = @(Get-ChildItem -LiteralPath $directory -Recurse -Filter 'sccache.exe' -File)
          if ($exe.Count -ne 1) { throw 'Expected exactly one sccache executable.' }
          $exe[0].DirectoryName | Add-Content -LiteralPath $env:GITHUB_PATH
          "SCCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'sccache-checkpoint')" | Add-Content -LiteralPath $env:GITHUB_ENV
          'SCCACHE_CACHE_SIZE=3G' | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Download the retained compiler checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.job == 'build' && 'azwah-startup-checkpoint-1' || format('azwah-full-cache-build-{0}', github.run_attempt) }}
          run-id: ${{ github.job == 'build' && '42900614067' || github.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/azwah-checkpoint-transfer
      - name: Verify and restore compiler checkpoint
        shell: pwsh
        run: ./scripts/native-full-checkpoint.ps1 -Restore
      - name: Build the full Chromium chrome target
        id: compile
        timeout-minutes: 300
        shell: pwsh
        run: |
          $pin = Get-Content -Raw native-chromium/upstream.json | ConvertFrom-Json
          ./scripts/build-native-chromium-baseline.ps1 -AzwahSource -FullCheckpoint -CheckpointDirectory (Join-Path $env:RUNNER_TEMP 'azwah-checkpoint-transfer') -Workspace $env:AZWAH_BUILD_WORKSPACE -DepotTools $env:AZWAH_DEPOT_TOOLS -ChromiumCommit $pin.revision -DepotToolsCommit $env:AZWAH_DEPOT_TOOLS_SHA -Jobs 4 -ReserveGiB 15
      - name: Save compiler work and cache statistics
        if: ${{ !cancelled() && steps.compile.outcome != 'skipped' }}
        shell: pwsh
        run: ./scripts/native-full-checkpoint.ps1
      - name: Upload compiler checkpoint
        id: upload
        if: ${{ !cancelled() && steps.compile.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: azwah-full-cache-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azwah-full-cache
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Verify linked browser and assemble runtime
        if: ${{ !cancelled() && steps.compile.outputs.linked == 'true' }}
        shell: pwsh
        run: |
          ./scripts/test-native-chromium-build.ps1 -Workspace $env:AZWAH_BUILD_WORKSPACE -OutputDirectory 'src/out/azwah-checkpoint-probe'
          ./scripts/native-full-checkpoint.ps1 -Payload
      - name: Upload verified browser runtime
        if: ${{ !cancelled() && steps.compile.outputs.linked == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: azwah-linked-browser-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azwah-linked-browser
          retention-days: 3
          if-no-files-found: error
  resume:
    needs: build
    if: ${{ !cancelled() && needs.build.outputs.resume == 'true' && needs.build.outputs.checkpoint != '' }}
    runs-on: windows-2025
    timeout-minutes: 340
    steps: *build_steps
