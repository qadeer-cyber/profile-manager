# M2+M3 source acceptance. Source tests only: never builds installers, never
# packages, never publishes. Tests the integrated tree exactly as checked out
# (no assemble/overlay). Manual dispatch only; requires owner authorization.
# t48u B2: no dispatch parameters. Execution is bound to the immutable commit
# GitHub resolved for this run (github.sha) on the dedicated integration branch
# only; there is no editable ref. Provenance (frozen ancestors, contract + addendum
# hashes, installer-workflow blob) is verified before any test runs.
name: M2 source acceptance (no installers)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m2-source-acceptance-${{ github.sha }}
  cancel-in-progress: false
jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/integration/m2-m3-source-gate'
    timeout-minutes: 90
    env:
      # Blob of .github/workflows/windows-native-validation.yml on main 281b0b2.
      PM_INSTALLER_WORKFLOW_BLOB: c9a8e5259a811ba9e99342185ec153850cb278cc
    steps:
      - name: Checkout integrated tree with full history (contract baseline d7a000e)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact SHA and provenance
        shell: bash
        env:
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "github.sha must be a full SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$RUN_SHA"
          # Frozen ancestry: main M3 merge, M2 backend, M2 UI, QA acceptance tip.
          for a in 281b0b2c5e1272994ab26d4111893ebdc6d2f7a9 d41eb1c6c5d65fa2f2a3ba861c1a8c509ac50838 14beab8ea27905c6a8fdd387babe6de83ad41c51 eb1b9c8d97332913067f641058fdc748ebbea280; do
            git merge-base --is-ancestor "$a" HEAD || { echo "missing frozen ancestor $a"; exit 1; }
          done
          # Contracts and addendum A1 unchanged.
          ( cd docs/handoff/m2/contracts && sha256sum -c SHA256SUMS && sha256sum -c SHA256SUMS.addendum-A1 )
          grep -q '^cd1ce49f379566efa0fa65ed81f5402f21259191cbdb6aa6088eb8413b8059d8 ' docs/handoff/m2/contracts/SHA256SUMS
          grep -q '^e80ce2d513e610a18c703b775fb0fd5520e3eb1ca5dce6f4ad43a1eecf08bdf4 ' docs/handoff/m2/contracts/SHA256SUMS
          grep -q '^6290869be994956f48c4576c63fe271e63fb63a3c4689d1b1659f9dae703add4 ' docs/handoff/m2/contracts/SHA256SUMS.addendum-A1
          # Installer workflow byte-identical to main.
          test "$(git hash-object .github/workflows/windows-native-validation.yml)" = "$PM_INSTALLER_WORKFLOW_BLOB"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium (checksummed)
        run: node scripts/m3-install-runtime.mjs --source=google
      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb && npx playwright install-deps chromium
      - name: Source acceptance (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1200x24" node scripts/m2-source-acceptance.mjs
      - name: Source acceptance (Windows)
        if: runner.os == 'Windows'
        run: node scripts/m2-source-acceptance.mjs
      - name: Confirm no installer output was produced
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G "release/*" > /dev/null || compgen -G "dist/*.exe" > /dev/null; then echo "installer output present"; exit 1; fi
      # Evidence upload: a storage/quota failure fails this step and the job
      # (no continue-on-error). results.json is also printed to the log above and
      # the job summary, so verdicts survive an artifact-storage failure.
      - name: Upload source-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-source-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: .m2/evidence/**
          if-no-files-found: error
          retention-days: 14
