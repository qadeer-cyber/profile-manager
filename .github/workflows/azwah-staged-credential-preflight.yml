name: Installed Windows staged credential preflight
on:
  push:
    branches: [codex/azwah-staged-credential-release]
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42398189745
          name: ultimate-installer-65927406b680a7aa8f51f2ea1c4272c7996cca13
          path: release-ultimate
      - name: Verify and probe the corrected installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          $sha = (Get-FileHash release-ultimate/Azwah-Multi-Browser-Ultimate-Setup-x64.exe).Hash.ToLowerInvariant()
          $size = (Get-Item release-ultimate/Azwah-Multi-Browser-Ultimate-Setup-x64.exe).Length
          $manifest = Get-Content release-ultimate/BUILD-MANIFEST.txt
          if ($manifest -notcontains "SHA256: $sha" -or $manifest -notcontains "Bytes: $size" -or $manifest -notcontains 'Installer source: 65927406b680a7aa8f51f2ea1c4272c7996cca13') { throw 'Wrong candidate' }
          Write-Host "Verified candidate $size bytes SHA-256 $sha"
          gh release download azwah-multi-browser-owner-experimental.1 --repo $env:GITHUB_REPOSITORY --pattern 'Azwah-Multi-Browser-Full-Setup-x64.exe' --dir prior-installers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/azwah-staged-credential-preflight.mjs
          exit $LASTEXITCODE
