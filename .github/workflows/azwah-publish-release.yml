name: Publish verified AZWAH release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact installed version from the build manifest
        required: true
        type: string
      acceptance_run:
        description: Successful installer acceptance run ID for this main commit
        required: true
        type: string
      native_run:
        description: Successful native validation run ID for this main commit
        required: true
        type: string
      upgrade_qualified:
        description: Approve publication after verifying the real A to B update and data retention
        required: true
        type: boolean
permissions:
  actions: read
  contents: write
concurrency:
  group: azwah-publish-release
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.upgrade_qualified
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
      ACCEPTANCE_RUN: ${{ inputs.acceptance_run }}
      NATIVE_RUN: ${{ inputs.native_run }}
    steps:
      - name: Verify the selected Windows runs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})(-beta\.(0|[1-9][0-9]{0,8}))?$ ]]
          verify_run() {
            [[ "$1" =~ ^[0-9]+$ ]]
            gh api "repos/$GH_REPO/actions/runs/$1" | jq -e \
              --arg sha "$GITHUB_SHA" --arg workflow ".github/workflows/$2" \
              '.head_branch == "main" and .head_sha == $sha and .path == $workflow and .conclusion == "success"' >/dev/null
          }
          verify_run "$ACCEPTANCE_RUN" azwah-ultimate-stable-chrome.yml
          verify_run "$NATIVE_RUN" windows-native-validation.yml
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.acceptance_run }}
          name: azwah-windows-x64-${{ github.sha }}
          path: candidate
      - name: Verify provenance and publish release assets
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          sed -i 's/\r$//' BUILD-MANIFEST.txt SHA256SUMS.txt
          grep -Fx "Source: $GITHUB_SHA" BUILD-MANIFEST.txt
          grep -Fx "Version: $VERSION" BUILD-MANIFEST.txt
          grep -Ex '[a-f0-9]{64}  Azwah-Setup-x64\.exe' SHA256SUMS.txt
          [[ "$(wc -l < SHA256SUMS.txt)" == 1 ]]
          sha256sum --strict --check SHA256SUMS.txt
          grep -Fx "SHA-256: $(cut -d ' ' -f1 SHA256SUMS.txt)" BUILD-MANIFEST.txt
          tag="azwah-v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists. Review its assets before retrying."
            exit 1
          fi
          # Create the version tag at the verified commit. A pre-existing tag is
          # rejected, so an unrelated tag can never redirect the release.
          gh api --method POST "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null
          flags=()
          if [[ "$VERSION" == *-beta.* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" --verify-tag --draft "${flags[@]}" \
            --title "AZWAH $VERSION" --generate-notes \
            Azwah-Setup-x64.exe SHA256SUMS.txt BUILD-MANIFEST.txt
          gh release edit "$tag" --draft=false
