name: Azwah Ultimate Windows release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      AZWAH_OWNER_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install native dependencies and system Firefox
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install firefox -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = Invoke-RestMethod 'https://addons.mozilla.org/api/v5/addons/addon/cookie-editor/' -TimeoutSec 60
          if ($metadata.guid -ne '{c3c10168-4186-445c-9c5b-63f12b8e2c87}') { throw 'Official Cookie-Editor identity mismatch' }
          $file = $metadata.current_version.file
          if ($file.url -notmatch '^https://addons.mozilla.org/' -or $file.hash -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Unexpected official artifact metadata' }
          $xpi = Join-Path $env:RUNNER_TEMP 'ultimate-cookie-editor.signed.xpi'
          for ($attempt=1; $attempt -le 3; $attempt++) {
            if (Test-Path $xpi) { Remove-Item $xpi -Force }
            try { Invoke-WebRequest $file.url -OutFile $xpi -TimeoutSec 60 -ErrorAction Stop; break }
            catch { if ($attempt -eq 3) { throw 'INFRASTRUCTURE_DOWNLOAD_FAILURE: official Cookie-Editor unavailable' }; Start-Sleep -Seconds ([int][Math]::Pow(2,$attempt)) }
          }
          if ('sha256:'+(Get-FileHash $xpi -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.hash) { Remove-Item $xpi -Force; throw 'Official Cookie-Editor checksum mismatch' }
          "PM_COOKIE_EDITOR_XPI=$xpi" >> $env:GITHUB_ENV
      - name: Build, install and verify the Ultimate Owner application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-evidence/ultimate-owner | Out-Null
          node scripts/build-ultimate-owner.mjs 2>&1 | Tee-Object build-evidence/ultimate-owner/transcript.log
          exit $LASTEXITCODE
      - name: Publish a new prerelease after download verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $tag = "azwah-multi-browser-ultimate-$($env:GITHUB_SHA.Substring(0,12))"
          $exe = 'Azwah-Multi-Browser-Ultimate-Setup-x64.exe'
          gh release view $tag --repo $env:GITHUB_REPOSITORY 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists and will not be replaced." }
          $ErrorActionPreference = 'Stop'
          gh release create $tag "release-ultimate-owner/$exe" release-ultimate-owner/SHA256SUMS.txt release-ultimate-owner/BUILD-MANIFEST.txt release-ultimate-owner/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "Azwah Multi Browser Ultimate $tag" --notes-file release-ultimate-owner/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'New release creation failed. Existing releases were not changed.' }
          $verify = Join-Path $env:RUNNER_TEMP 'ultimate-owner-download'
          New-Item -ItemType Directory -Force $verify | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $exe --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Draft download verification failed. Release remains draft.' }
          $local = (Get-FileHash "release-ultimate-owner/$exe" -Algorithm SHA256).Hash
          $remote = (Get-FileHash (Join-Path $verify $exe) -Algorithm SHA256).Hash
          if ($local -ne $remote) { throw 'Uploaded EXE checksum mismatch. Release remains draft.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,isPrerelease,assets | Out-File build-evidence/ultimate-owner/published.json -Encoding utf8
      - name: Preserve installer acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-owner-${{ github.sha }}
          path: build-evidence/ultimate-owner
          retention-days: 30
  admin:
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      AZWAH_QA_SEPARATE_IDENTITY: '1'
      AZWAH_QA_STARTUP_ONLY: '0'
      AZWAH_ADMIN_BUILD_SHA: ${{ github.sha }}
      AZWAH_ADMIN_SETUP: release-ultimate-admin/Azwah-License-Admin-Ultimate-Setup-x64.exe
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare Windows acceptance dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install nsis firefox -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = Invoke-RestMethod 'https://addons.mozilla.org/api/v5/addons/addon/cookie-editor/' -TimeoutSec 60
          if ($metadata.guid -ne '{c3c10168-4186-445c-9c5b-63f12b8e2c87}') { throw 'Cookie-Editor identity mismatch' }
          $file = $metadata.current_version.file
          if ($file.url -notmatch '^https://addons.mozilla.org/' -or $file.hash -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Invalid official artifact metadata' }
          $xpi = Join-Path $env:RUNNER_TEMP 'qualification-cookie-editor.xpi'
          for ($attempt=1; $attempt -le 3; $attempt++) {
            try { Invoke-WebRequest $file.url -OutFile $xpi -TimeoutSec 60 -ErrorAction Stop; break }
            catch { if (Test-Path $xpi) { Remove-Item $xpi -Force }; if ($attempt -eq 3) { throw }; Start-Sleep -Seconds (2*$attempt) }
          }
          if ('sha256:'+(Get-FileHash $xpi -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.hash) { throw 'Official XPI checksum mismatch' }
          "PM_COOKIE_EDITOR_XPI=$xpi" >> $env:GITHUB_ENV
      - name: Rebuild Admin with the current Office browser payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item "${env:ProgramFiles(x86)}\NSIS" build/admin-nsis -Recurse
          npm run test:office
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/fetch-bundled-chromium.mjs win64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder install-app-deps --arch=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --config electron-builder.office-payload.cjs --win --dir --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --config electron-builder.ultimate-admin.cjs --win nsis --x64 --publish never
          exit $LASTEXITCODE
      - name: Qualify installed Admin and the generated Office payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-evidence/ultimate-admin | Out-Null
          node scripts/qualify-license-gui.mjs 2>&1 | Tee-Object build-evidence/ultimate-admin/acceptance.log
          exit $LASTEXITCODE
      - name: Publish a new Admin prerelease after download verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'Azwah-License-Admin-Ultimate-Setup-x64.exe'
          $dir = 'release-ultimate-admin'
          $installer = Join-Path $dir $name
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item $installer).Length
          $signature = (Get-AuthenticodeSignature -LiteralPath $installer).Status
          $run = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          "$hash  $name" | Set-Content -Encoding ascii "$dir/SHA256SUMS.txt"
          @(
            "Source: $env:GITHUB_SHA"
            "Installer: $name"
            "Bytes: $size"
            "SHA256: $hash"
            "Authenticode: $signature"
            "Host: Windows Server 2022 x64"
            "Windows 10: not qualified"
            "Evidence: $run"
            "Does not replace azwah-license-admin-experimental.1"
          ) | Set-Content "$dir/BUILD-MANIFEST.txt"
          @"
          # Azwah License Admin Ultimate — experimental

          Install this Admin setup, create an organization and master password, and keep the encrypted backup. Generate the Office installer from the Admin GUI. The bundled employee application includes the current profile UI. No production private key is in this download. The organization key is created on the administrator computer.

          Qualified on Windows Server 2022 with separate accounts. Windows 10 was not qualified. Unsigned. This release does not replace azwah-license-admin-experimental.1.

          Source: $env:GITHUB_SHA
          Windows evidence: $run
          Authenticode: $signature
          "@ | Set-Content "$dir/RELEASE-NOTES.md"
          $ErrorActionPreference = 'Continue'
          $tag = "azwah-license-admin-ultimate-$($env:GITHUB_SHA.Substring(0,12))"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists and will not be replaced." }
          $ErrorActionPreference = 'Stop'
          gh release create $tag $installer "$dir/SHA256SUMS.txt" "$dir/BUILD-MANIFEST.txt" "$dir/RELEASE-NOTES.md" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title "Azwah License Admin Ultimate $tag" --notes-file "$dir/RELEASE-NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create a new release. Existing releases were not changed.' }
          $verify = Join-Path $env:RUNNER_TEMP 'ultimate-admin-download'
          New-Item -ItemType Directory -Force $verify | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $name --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Draft download failed. Release remains draft.' }
          if ((Get-FileHash (Join-Path $verify $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Uploaded EXE checksum mismatch. Release remains draft.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,isPrerelease,assets | Out-File build-evidence/ultimate-admin/published.json -Encoding utf8
      - name: Preserve Admin acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultimate-admin-${{ github.sha }}
          path: build-evidence/ultimate-admin
          retention-days: 30
