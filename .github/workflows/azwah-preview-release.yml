name: Azwah restricted preview build and release
on:
  push:
    branches: [feature/azwah-office-edition]
    paths:
      - '.github/workflows/azwah-preview-release.yml'
      - 'scripts/build-preview.mjs'
      - 'scripts/preview-before-pack.cjs'
      - 'electron-builder.preview.cjs'
permissions:
  contents: read
jobs:
  preview:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install native dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, inspect and install restricted preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-evidence/preview | Out-Null
          node scripts/build-preview.mjs 2>&1 | Tee-Object build-evidence/preview/transcript.log
          exit $LASTEXITCODE
      - name: Publish unique experimental prerelease only after byte verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'azwah-multi-browser-preview.1'
          $exe = 'Azwah-Multi-Browser-Preview-Setup-x64.exe'
          gh release create $tag "release-preview/$exe" release-preview/SHA256SUMS.txt release-preview/BUILD-MANIFEST.txt release-preview/RELEASE-NOTES.md --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --prerelease --title 'Azwah Multi Browser — Restricted Experimental Preview' --notes-file release-preview/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'New release creation failed; existing releases will not be changed.' }
          $verify = Join-Path $env:RUNNER_TEMP 'preview-release-download-verification'
          New-Item -ItemType Directory -Force $verify | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $exe --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset download verification failed; release remains draft.' }
          $expected = (Get-FileHash "release-preview/$exe" -Algorithm SHA256).Hash
          $actual = (Get-FileHash (Join-Path $verify $exe) -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Uploaded installer checksum mismatch; release remains draft.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,isPrerelease,assets | Out-File build-evidence/preview/published.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Published release metadata verification failed.' }
      - name: Preserve release-specific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restricted-preview-${{ github.sha }}
          path: build-evidence/preview
          retention-days: 30
