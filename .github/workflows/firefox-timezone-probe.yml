name: Firefox supported timezone mechanism probe
on:
  push:
    branches: [integration/ultimate3-unified]
    paths: ['server/firefox-bidi.js', 'test/firefox-timezone-windows.test.js', '.github/workflows/firefox-timezone-probe.yml']
permissions:
  contents: read
jobs:
  firefox-timezone:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Native dependencies and stock Firefox
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install firefox -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build-evidence/timezone | Out-Null
      - name: Observe supported timezone emulation and concurrent Marionette ownership
        shell: pwsh
        run: |
          node --test test/firefox-timezone-windows.test.js 2>&1 | Tee-Object build-evidence/timezone/firefox-timezone.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-timezone-${{ github.sha }}
          path: build-evidence/timezone
          retention-days: 14
