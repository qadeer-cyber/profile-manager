name: Independent preserved Ultimate migration acceptance
on:
  push:
    branches: [codex/azwah-asar-evidence]
permissions:
  actions: read
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: bd5995a0867a651804879f31ef9d1f04e180b090
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 42392300409
          name: ultimate-installer-8baf1ffe13387bf3fba056d756a448da8b0e1e29
          path: retained-installer
      - name: Verify checksum and source
        shell: pwsh
        run: |
          $name = 'Azwah-Multi-Browser-Ultimate-Setup-x64.exe'
          $exe = Join-Path $PWD "retained-installer/$name"
          $checksum = (Get-Content retained-installer/SHA256SUMS.txt -Raw).Trim()
          if ($checksum -notmatch '^([0-9a-fA-F]{64})\s+\*?Azwah-Multi-Browser-Ultimate-Setup-x64\.exe$') { throw 'Unexpected checksum entry' }
          $expected = $Matches[1].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Installer checksum mismatch' }
          if (!(Select-String -Quiet -SimpleMatch -LiteralPath retained-installer/BUILD-MANIFEST.txt -Pattern 'Installer source: 8baf1ffe13387bf3fba056d756a448da8b0e1e29')) { throw 'Unexpected installer source' }
          Write-Host "VERIFIED_EXE_SHA256 $actual; bytes $((Get-Item -LiteralPath $exe).Length)"
          "AZWAH_UNIFIED_INSTALLER=$exe" >> $env:GITHUB_ENV
          "AZWAH_UNIFIED_INSTALLER_SHA256=$actual" >> $env:GITHUB_ENV
      - name: Run the ASAR regression on Windows
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/ultimate-asar-listing.test.js
          exit $LASTEXITCODE
      - name: Download published legacy installers
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download azwah-multi-browser-owner-experimental.1 --repo $env:GITHUB_REPOSITORY --pattern 'Azwah-Multi-Browser-Full-Setup-x64.exe' --dir prior-installers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download azwah-license-admin-experimental.1 --repo $env:GITHUB_REPOSITORY --pattern 'Azwah-License-Admin-Setup-x64.exe' --dir prior-installers
          exit $LASTEXITCODE
      - name: Run installed migration acceptance with the retained EXE
        shell: pwsh
        env:
          AZWAH_MIGRATION_ONLY: '1'
        run: |
          node scripts/ultimate-unified-acceptance.mjs
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-ultimate-acceptance
          path: build-evidence/ultimate-unified/acceptance.json
          if-no-files-found: ignore
