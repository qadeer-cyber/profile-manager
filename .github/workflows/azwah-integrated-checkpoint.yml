name: Azwah Chromium checkpoint replay
on:
  push:
    branches: [engineering/azwah-integrated-engine]
    paths: [.github/workflows/azwah-integrated-checkpoint.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: azwah-integrated-checkpoint
  cancel-in-progress: false
jobs:
  seed:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/engineering/azwah-integrated-engine' }}
    runs-on: windows-2025
    timeout-minutes: 100
    steps: &checkpoint_steps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare and verify the pinned Windows toolchain
        shell: pwsh
        run: ./scripts/prepare-native-windows-sdk.ps1 -Workspace $env:GITHUB_WORKSPACE
      - name: Checkout pinned depot_tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) 'azwah-checkpoint'
          $tools = Join-Path $root 'depot_tools'
          $workspace = Join-Path $root 'chromium'
          $pin = '96a7c1418eedaa6bea333a8941e8a0078681b4d0'
          New-Item -ItemType Directory -Path $tools,$workspace | Out-Null
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git -C $tools init --quiet
          git -C $tools remote add origin https://chromium.googlesource.com/chromium/tools/depot_tools.git
          git -C $tools fetch --no-tags --depth=1 origin $pin
          if ($LASTEXITCODE -ne 0) { throw 'Pinned depot_tools fetch failed.' }
          git -C $tools checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git -C $tools rev-parse HEAD) -ne $pin) { throw 'depot_tools pin did not verify.' }
          @("AZWAH_BUILD_WORKSPACE=$workspace", "AZWAH_DEPOT_TOOLS=$tools", "AZWAH_DEPOT_TOOLS_SHA=$pin") | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Initialize and qualify pinned depot_tools Python before Chromium sync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/qualify-native-depot-tools.ps1 -DepotTools $env:AZWAH_DEPOT_TOOLS -ExpectedCommit $env:AZWAH_DEPOT_TOOLS_SHA
      - name: Verify pinned Mozilla sccache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest 'https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash -ine '28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1') {
            throw 'sccache release checksum mismatch.'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'sccache'
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $exe = @(Get-ChildItem -LiteralPath $directory -Recurse -Filter 'sccache.exe' -File)
          if ($exe.Count -ne 1) { throw 'Expected exactly one sccache executable.' }
          $exe[0].DirectoryName | Add-Content -LiteralPath $env:GITHUB_PATH
          "SCCACHE_DIR=$(Join-Path $env:RUNNER_TEMP 'sccache-checkpoint')" | Add-Content -LiteralPath $env:GITHUB_ENV
          'SCCACHE_CACHE_SIZE=512M' | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Retrieve the seed checkpoint
        if: github.job == 'replay'
        uses: actions/download-artifact@v4
        with:
          name: azwah-icu-checkpoint-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azwah-checkpoint-transfer
      - name: Restore the verified compiler archive
        if: github.job == 'replay'
        shell: pwsh
        run: ./scripts/native-checkpoint-transfer.ps1 -Stage Restore
      - name: Sync dependencies, generate GN and compile the patched ICU target
        timeout-minutes: 80
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -Raw native-chromium/upstream.json | ConvertFrom-Json
          ./scripts/build-native-chromium-baseline.ps1 -AzwahSource -CheckpointProbe -CheckpointDirectory (Join-Path $env:RUNNER_TEMP 'azwah-checkpoint-transfer') -Workspace $env:AZWAH_BUILD_WORKSPACE -DepotTools $env:AZWAH_DEPOT_TOOLS -ChromiumCommit $pin.revision -DepotToolsCommit $env:AZWAH_DEPOT_TOOLS_SHA -Jobs 3 -ReserveGiB 10
      - name: Measure compiler reuse and check output parity
        if: always()
        shell: pwsh
        run: ./scripts/native-checkpoint-transfer.ps1 -Stage Measure
      - name: Upload seed cache and integrity manifest
        if: github.job == 'seed'
        uses: actions/upload-artifact@v4
        with:
          name: azwah-icu-checkpoint-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azwah-checkpoint-transfer
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Upload replay evidence
        if: ${{ always() && github.job == 'replay' }}
        uses: actions/upload-artifact@v4
        with:
          name: azwah-icu-replay-${{ github.run_attempt }}
          path: ${{ runner.temp }}/azwah-checkpoint-evidence
          retention-days: 3
          if-no-files-found: ignore
  replay:
    needs: seed
    runs-on: windows-2025
    timeout-minutes: 100
    steps: *checkpoint_steps
