name: AZWAH Chromium chained build
# Owner-approved: compile the AZWAH Chromium patch on free GitHub Windows runners by splitting the
# build across chained jobs. Each job compiles until its time budget, then hands the sccache compiler
# cache to the next job as a short-lived artifact. The job that finishes uploads the browser.
on:
  push:
    branches: [feature/azwah-ultimate-2]
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Continue from the last hand-over of this earlier chain run (its run ID); empty starts from zero'
        required: false
        default: ''
permissions:
  contents: read
  # Needed only to download another run's hand-over artifacts when resuming.
  actions: read
env:
  DEPOT_TOOLS_PIN: 96a7c1418eedaa6bea333a8941e8a0078681b4d0
  SCCACHE_CACHE_SIZE: 40G
  SCCACHE_DIRECT: 'true'
jobs:
  qualify:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          contains(github.event.head_commit.message, '[chromium-chain]') }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Parse the build script and check the patch applies to the pinned Chromium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in 'scripts/build-native-chromium-baseline.ps1', 'scripts/test-native-chromium-build.ps1') {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $script), [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors -join [Environment]::NewLine) }
          }
          git config --global core.autocrlf false
          git config --global core.longpaths true
          $pin = Get-Content -Raw native-chromium/upstream.json | ConvertFrom-Json
          $source = Join-Path $env:RUNNER_TEMP 'azwah-patch-qualification'
          New-Item -ItemType Directory -Path $source | Out-Null
          git -C $source init --quiet
          git -C $source config core.autocrlf false
          git -C $source remote add origin https://chromium.googlesource.com/chromium/src.git
          git -C $source sparse-checkout init --no-cone
          $paths = @(git apply --numstat native-chromium/windows-source.patch | ForEach-Object { ($_ -split "`t")[2] })
          git -C $source sparse-checkout set --no-cone -- $paths
          git -C $source fetch --depth=1 --filter=blob:none origin $pin.revision
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Chromium fetch failed.' }
          git -C $source checkout --detach FETCH_HEAD
          ./scripts/qualify-native-chromium-patch.ps1 -Source $source -Patch native-chromium/windows-source.patch -Apply

  stage-1:
    needs: qualify
    runs-on: windows-2025
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.build.outputs.complete }}
    steps: &stage
      - name: Record the job start
        shell: pwsh
        run: "\"AZWAH_JOB_START=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())\" | Add-Content -LiteralPath $env:GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare and verify the pinned Windows toolchain
        shell: pwsh
        run: ./scripts/prepare-native-windows-sdk.ps1 -Workspace $env:GITHUB_WORKSPACE
      - name: Checkout pinned depot_tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Short paths: Chromium object paths reach 183 characters, and sccache cannot write an object whose
          # full path reaches Windows' 260-character limit (run 44798415536 stage 2: exactly 260, os error 3).
          $root = Join-Path ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) 'az'
          $tools = Join-Path $root 't'
          $workspace = Join-Path $root 'c'
          New-Item -ItemType Directory -Path $tools,$workspace | Out-Null
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git -C $tools init --quiet
          git -C $tools remote add origin https://chromium.googlesource.com/chromium/tools/depot_tools.git
          git -C $tools fetch --no-tags --depth=1 origin $env:DEPOT_TOOLS_PIN
          if ($LASTEXITCODE -ne 0) { throw 'Pinned depot_tools fetch failed.' }
          git -C $tools checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0 -or (git -C $tools rev-parse HEAD) -ne $env:DEPOT_TOOLS_PIN) { throw 'depot_tools pin did not verify.' }
          @("AZWAH_BUILD_WORKSPACE=$workspace", "AZWAH_DEPOT_TOOLS=$tools", "AZWAH_CACHE=$(Join-Path $root 's')") | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Initialize and qualify pinned depot_tools
        shell: pwsh
        run: ./scripts/qualify-native-depot-tools.ps1 -DepotTools $env:AZWAH_DEPOT_TOOLS -ExpectedCommit $env:DEPOT_TOOLS_PIN
      - name: Install pinned Mozilla sccache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'sccache.zip'
          Invoke-WebRequest 'https://github.com/mozilla/sccache/releases/download/v0.19.0/sccache-v0.19.0-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash -ine '28be8c61f6b2c89b9eb2869f6af7f78e6f992e78a8abae0ce855fcc129cbeac1') { throw 'sccache release checksum mismatch.' }
          $directory = Join-Path $env:RUNNER_TEMP 'sccache-bin'
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $exe = @(Get-ChildItem -LiteralPath $directory -Recurse -Filter 'sccache.exe' -File)
          if ($exe.Count -ne 1) { throw 'Expected exactly one sccache executable.' }
          $exe[0].DirectoryName | Add-Content -LiteralPath $env:GITHUB_PATH
          "SCCACHE_DIR=$env:AZWAH_CACHE" | Add-Content -LiteralPath $env:GITHUB_ENV
          New-Item -ItemType Directory -Path $env:AZWAH_CACHE -Force | Out-Null
      - name: Restore the compiler cache from the previous job
        if: github.job != 'stage-1'
        uses: actions/download-artifact@v4
        with:
          name: azwah-sccache-${{ github.run_id }}
          path: ${{ env.AZWAH_CACHE }}
      - name: Restore the previous Ninja build directory
        if: github.job != 'stage-1'
        # Without it the stage still works from the compiler cache, only slower.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: azwah-ninja-out-${{ github.run_id }}
          path: ${{ runner.temp }}/ninja-out
      # Resume: stage 1 continues from the last hand-over of an earlier run instead of starting from zero.
      - name: Resume - restore the compiler cache from the earlier run
        if: github.job == 'stage-1' && inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: azwah-sccache-${{ inputs.resume_run_id }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ env.AZWAH_CACHE }}
      - name: Resume - restore the Ninja build directory from the earlier run
        if: github.job == 'stage-1' && inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: azwah-ninja-out-${{ inputs.resume_run_id }}
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ninja-out
      - name: Resume - refuse to start from zero
        if: github.job == 'stage-1' && inputs.resume_run_id != ''
        shell: pwsh
        run: |
          $tar = Join-Path $env:RUNNER_TEMP 'ninja-out/ninja-out.tar'
          if (!(Test-Path -LiteralPath $tar -PathType Leaf)) { throw "Resume requested but no build directory from run ${{ inputs.resume_run_id }}" }
          Write-Output "RESUME_FROM run=${{ inputs.resume_run_id }} out_tar_bytes=$((Get-Item $tar).Length)"
      - name: Sync, patch and compile until the time budget
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Get-Content -Raw native-chromium/upstream.json | ConvertFrom-Json
          # 355-minute job: leave 35 minutes to stop sccache and hand the cache to the next job.
          $elapsed = [int](([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [int64]$env:AZWAH_JOB_START) / 60)
          $budget = [Math]::Max(30, 355 - 35 - $elapsed - 25)
          Write-Output "Job ${env:GITHUB_JOB}: $elapsed minutes used before the build; Ninja budget after sync is about $budget minutes."
          $outArchive = Join-Path $env:RUNNER_TEMP 'ninja-out/ninja-out.tar'
          $restore = if (Test-Path -LiteralPath $outArchive) { @{ RestoreOutArchive = $outArchive } } else { @{} }
          ./scripts/build-native-chromium-baseline.ps1 -AzwahSource -Sccache -TimeBudgetMinutes $budget @restore `
            -Workspace $env:AZWAH_BUILD_WORKSPACE -DepotTools $env:AZWAH_DEPOT_TOOLS -ChromiumCommit $pin.revision `
            -DepotToolsCommit $env:DEPOT_TOOLS_PIN -Jobs 4 -ReserveGiB 10
      - name: Compiler cache statistics
        if: always()
        # Evidence only. With nothing to compile the sccache server may already have exited, so --stop-server fails;
        # that must not skip the smoke test (run 45233749627).
        continue-on-error: true
        shell: pwsh
        run: |
          sccache.exe --show-stats
          sccache.exe --show-stats --stats-format json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'sccache-stats.json')
          sccache.exe --stop-server
          $bytes = (Get-ChildItem -LiteralPath $env:AZWAH_CACHE -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Output "CACHE_BYTES $bytes"
          $global:LASTEXITCODE = 0
      # Build inputs that decide sccache keys, recorded per stage so stages can be compared from evidence
      # rather than from assumptions. Text only; no profiles, credentials or sources.
      - name: Record build inputs for cache diagnosis
        if: always()
        # Evidence only: it must never fail the job or block the cache hand-over (run 44749921438).
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'chain-diagnostics'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $src = Join-Path $env:AZWAH_BUILD_WORKSPACE 'src'
          $out = Join-Path $src 'out/azwah-native-development'
          $report = [ordered]@{ job = $env:GITHUB_JOB; runnerImage = $env:ImageVersion; os = [Environment]::OSVersion.VersionString;
            workspace = $env:AZWAH_BUILD_WORKSPACE; freeBytes = ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($env:AZWAH_BUILD_WORKSPACE))).AvailableFreeSpace }
          try { $report.chromiumRevision = (git -C $src rev-parse HEAD) } catch {}
          try { $report.argsGn = Get-Content -Raw (Join-Path $out 'args.gn') } catch {}
          try { $report.clangCl = (& (Join-Path $src 'third_party/llvm-build/Release+Asserts/bin/clang-cl.exe') --version | Out-String) } catch {}
          try { $report.sccache = (sccache.exe --version | Out-String) } catch {}
          try { $report.visualStudio = (& "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -property catalog_productDisplayVersion) } catch {}
          try { $report.windowsSdks = @(Get-ChildItem "${env:ProgramFiles(x86)}/Windows Kits/10/Include" -Directory | ForEach-Object Name) } catch {}
          try { $env:Path = "$env:AZWAH_DEPOT_TOOLS;$env:Path"
            $report.sampleCommands = @('obj/base/base/values.obj', 'obj/v8/v8_base_without_compiler/objects.obj') |
              ForEach-Object { $ninja = Join-Path $src 'third_party/ninja/ninja.exe'; if (!(Test-Path $ninja)) { $ninja = 'ninja.exe' }; (& $ninja -C $out -t commands $_ 2>$null | Select-Object -Last 1) } } catch {}
          foreach ($name in 'INCLUDE', 'LIB', 'LIBPATH') {
            $value = [Environment]::GetEnvironmentVariable($name)
            $report["env_$name"] = if ($value) { [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($value))).Replace('-', '') } else { $null }
          }
          $report | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $dir 'build-inputs.json')
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'sccache-stats.json') -Destination $dir -ErrorAction SilentlyContinue
          Get-Content -Raw (Join-Path $dir 'build-inputs.json')
          $global:LASTEXITCODE = 0
      # Read-only: why already-built //base objects are treated as dirty (run 44798415536 stage 2 rebuilt
      # obj/base/base/atl_throw.obj). Bounded output; can never fail the stage.
      - name: Explain dirty //base objects (diagnostic)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $src = Join-Path $env:AZWAH_BUILD_WORKSPACE 'src'
          $out = Join-Path $src 'out/azwah-native-development'
          if (Test-Path (Join-Path $out 'build.ninja')) {
            $ninja = Join-Path $src 'third_party/ninja/ninja.exe'
            if (!(Test-Path $ninja)) { $ninja = 'ninja.exe' }
            $watched = @('obj/base/base/atl_throw.obj', 'obj/base/base/values.obj', 'obj/base/base/page_size_win.obj', 'obj/base/base/byte_size.obj')
            & $ninja -C $out -t deps @watched 2>&1 | node scripts/chain-ninja-explain.mjs deps
            & $ninja -C $out -n -d explain chrome 2>&1 | node scripts/chain-ninja-explain.mjs explain
          } else { Write-Output 'NINJA_EXPLAIN skipped: no build.ninja' }
          $global:LASTEXITCODE = 0
      - name: Upload build-input diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: azwah-chain-diagnostics-${{ github.run_id }}-${{ github.job }}
          path: ${{ runner.temp }}/chain-diagnostics
          retention-days: 14
      # The Ninja build directory goes on with the compiler cache, so the next stage skips finished work.
      - name: Pack the Ninja build directory for the next job
        id: packout
        # Also when the build finished: a failed smoke test must not lose the finished build.
        if: ${{ !cancelled() && (steps.build.outputs.complete == 'false' || steps.build.outputs.complete == 'true') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:AZWAH_BUILD_WORKSPACE 'src'
          $tar = Join-Path $env:RUNNER_TEMP 'ninja-out.tar'
          $started = Get-Date
          & tar -cf $tar -C $src out/azwah-native-development
          if ($LASTEXITCODE -ne 0) { throw 'Could not pack the build directory.' }
          Write-Output "OUT_PACKED bytes=$((Get-Item $tar).Length) seconds=$([int]((Get-Date) - $started).TotalSeconds)"
          "AZWAH_OUT_TAR=$tar" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Hand the Ninja build directory to the next job
        if: ${{ !cancelled() && steps.packout.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: azwah-ninja-out-${{ github.run_id }}
          path: ${{ env.AZWAH_OUT_TAR }}
          retention-days: 5
          compression-level: 1
          overwrite: true
      - name: Hand the compiler cache to the next job
        # Runs whenever the build stopped at its budget or finished, whatever happened in later evidence steps.
        if: ${{ !cancelled() && (steps.build.outputs.complete == 'false' || steps.build.outputs.complete == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: azwah-sccache-${{ github.run_id }}
          path: ${{ env.AZWAH_CACHE }}
          retention-days: 5
          compression-level: 0
          overwrite: true
      - name: Verify and smoke-test the finished browser
        if: steps.build.outputs.complete == 'true'
        shell: pwsh
        run: ./scripts/test-native-chromium-build.ps1 -Workspace $env:AZWAH_BUILD_WORKSPACE
      - name: Package the finished browser
        if: steps.build.outputs.complete == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:AZWAH_BUILD_WORKSPACE 'src/out/azwah-native-development'
          $stage = Join-Path $env:RUNNER_TEMP 'azwah-chromium'
          New-Item -ItemType Directory -Path $stage | Out-Null
          $runtime = Get-ChildItem -LiteralPath $out -File | Where-Object { $_.Extension -in '.exe', '.dll', '.pak', '.bin', '.dat', '.json', '.manifest' -and $_.Name -notlike '*.ninja*' }
          foreach ($file in $runtime) { Copy-Item -LiteralPath $file.FullName -Destination $stage }
          foreach ($dir in 'locales', 'MEIPreload', 'resources') {
            if (Test-Path -LiteralPath (Join-Path $out $dir)) { Copy-Item -LiteralPath (Join-Path $out $dir) -Destination $stage -Recurse }
          }
          # Provenance: every file with its SHA-256, source pins, toolchain and CI run; verified before zipping.
          $pin = Get-Content -Raw native-chromium/upstream.json | ConvertFrom-Json
          $clang = (& (Join-Path $env:AZWAH_BUILD_WORKSPACE 'src/third_party/llvm-build/Release+Asserts/bin/clang-cl.exe') --version | Select-Object -First 1)
          $inputs = [ordered]@{ azwahCommit = $env:GITHUB_SHA; chromiumRevision = $pin.revision; chromiumVersion = $pin.version
            patchSha256 = (Get-FileHash native-chromium/windows-source.patch).Hash.ToLowerInvariant()
            gnArgsSha256 = (Get-FileHash (Join-Path $out 'args.gn')).Hash.ToLowerInvariant()
            toolchain = @{ clang = "$clang"; visualStudio = $pin.visualStudioVersion; windowsSdk = $pin.windowsSdkVersion }
            runId = $env:GITHUB_RUN_ID; stage = $env:GITHUB_JOB; runner = $env:ImageVersion
            smoke = @{ result = 'passed'; by = 'scripts/test-native-chromium-build.ps1 on the build runner' } }
          $inputsFile = Join-Path $env:RUNNER_TEMP 'native-inputs.json'
          $inputs | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $inputsFile -Encoding utf8
          node scripts/native-artifact.mjs manifest $stage $inputsFile | Set-Content -LiteralPath (Join-Path $stage 'AZWAH-NATIVE-MANIFEST.json') -Encoding utf8
          node scripts/native-artifact.mjs verify $stage (Join-Path $stage 'AZWAH-NATIVE-MANIFEST.json')
          if ($LASTEXITCODE -ne 0) { throw 'The packaged browser failed manifest verification.' }
          $zip = Join-Path $env:RUNNER_TEMP 'azwah-chromium-win64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "AZWAH_CHROMIUM_ZIP bytes=$((Get-Item $zip).Length) sha256=$hash"
          "AZWAH_CHROMIUM_ZIP=$zip" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Upload the finished browser
        if: steps.build.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: azwah-chromium-win64-${{ github.sha }}
          path: ${{ env.AZWAH_CHROMIUM_ZIP }}
          retention-days: 14

  stage-2:
    needs: stage-1
    if: needs.stage-1.outputs.complete == 'false'
    runs-on: windows-2025
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.build.outputs.complete }}
    steps: *stage
  stage-3:
    needs: stage-2
    if: needs.stage-2.outputs.complete == 'false'
    runs-on: windows-2025
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.build.outputs.complete }}
    steps: *stage
  stage-4:
    needs: stage-3
    if: needs.stage-3.outputs.complete == 'false'
    runs-on: windows-2025
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.build.outputs.complete }}
    steps: *stage
  stage-5:
    needs: stage-4
    if: needs.stage-4.outputs.complete == 'false'
    runs-on: windows-2025
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.build.outputs.complete }}
    steps: *stage
  stage-6:
    needs: stage-5
    if: needs.stage-5.outputs.complete == 'false'
    runs-on: windows-2025
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.build.outputs.complete }}
    steps: *stage

  # A clean runner, without the build tree: download the finished browser, verify its manifest and hashes,
  # then start it, load a local page, close it gracefully and relaunch it (scripts/native-smoke.mjs).
  fresh-runner-smoke:
    needs: [stage-1, stage-2, stage-3, stage-4, stage-5, stage-6]
    if: >-
      ${{ always() && (needs.stage-1.outputs.complete == 'true' || needs.stage-2.outputs.complete == 'true' ||
          needs.stage-3.outputs.complete == 'true' || needs.stage-4.outputs.complete == 'true' ||
          needs.stage-5.outputs.complete == 'true' || needs.stage-6.outputs.complete == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: azwah-chromium-win64-${{ github.sha }}
          path: ${{ runner.temp }}/browser-zip
      - name: Verify the archive and smoke-test the browser on a fresh runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'browser-zip') -Filter '*.zip' | Select-Object -First 1
          Write-Output "ARCHIVE_SHA256 $((Get-FileHash -LiteralPath $zip.FullName).Hash.ToLowerInvariant()) bytes=$($zip.Length)"
          $dir = Join-Path $env:RUNNER_TEMP 'browser'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dir
          # Same sandbox folder access as on the build runner (see scripts/test-native-chromium-build.ps1).
          & "$env:SystemRoot/System32/icacls.exe" $dir /grant '*S-1-15-2-1:(OI)(CI)(RX)' '*S-1-15-2-2:(OI)(CI)(RX)' /T /C /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not grant sandbox read access to the unpacked browser.' }
          node scripts/native-artifact.mjs verify $dir (Join-Path $dir 'AZWAH-NATIVE-MANIFEST.json')
          if ($LASTEXITCODE -ne 0) { throw 'Manifest verification failed on the fresh runner.' }
          $pin = Get-Content -Raw native-chromium/upstream.json | ConvertFrom-Json
          node scripts/native-smoke.mjs (Join-Path $dir 'chrome.exe') --expect-version $pin.version
          if ($LASTEXITCODE -ne 0) { throw 'Fresh-runner smoke test failed.' }
