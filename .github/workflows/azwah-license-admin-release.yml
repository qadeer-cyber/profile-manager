name: Qualify and release Azwah License Admin
on:
  push:
    branches: [feature/azwah-office-edition]
    paths: ['.github/workflows/azwah-license-admin-release.yml']
permissions:
  actions: read
  contents: read
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      actions: read
      contents: write
    env:
      AZWAH_QA_SEPARATE_IDENTITY: '1'
      AZWAH_QA_STARTUP_ONLY: '0'
      AZWAH_ADMIN_BUILD_SHA: '49dd75be24ebac1e7197fa08fcfcdf5d45405536'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Wait for the candidate build and installed smoke checks
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run watch 42252533636 --repo $env:GITHUB_REPOSITORY --exit-status --interval 15
          exit $LASTEXITCODE
      - uses: actions/download-artifact@v4
        with:
          name: azwah-license-admin
          path: release-license-admin
          run-id: 42252533636
          github-token: ${{ github.token }}
      - name: Prepare Windows acceptance dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install firefox -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = Invoke-RestMethod 'https://addons.mozilla.org/api/v5/addons/addon/cookie-editor/' -TimeoutSec 60
          if ($metadata.guid -ne '{c3c10168-4186-445c-9c5b-63f12b8e2c87}') { throw 'Cookie-Editor identity mismatch' }
          $file = $metadata.current_version.file
          if ($file.url -notmatch '^https://addons.mozilla.org/' -or $file.hash -notmatch '^sha256:[a-f0-9]{64}$') { throw 'Invalid official artifact metadata' }
          $xpi = Join-Path $env:RUNNER_TEMP 'qualification-cookie-editor.xpi'
          for ($attempt=1; $attempt -le 3; $attempt++) {
            try { Invoke-WebRequest $file.url -OutFile $xpi -TimeoutSec 60 -ErrorAction Stop; break }
            catch { if (Test-Path $xpi) { Remove-Item $xpi -Force }; if ($attempt -eq 3) { throw }; Start-Sleep -Seconds (2*$attempt) }
          }
          if ('sha256:'+(Get-FileHash $xpi -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.hash) { throw 'Official XPI checksum mismatch' }
          "PM_COOKIE_EDITOR_XPI=$xpi" >> $env:GITHUB_ENV
      - name: Qualify installed Admin and Office under separate Windows accounts with the employee profile environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-evidence/license-gui | Out-Null
          if ($env:AZWAH_QA_STARTUP_ONLY -eq '1') {
            node scripts/diagnose-office-startup.mjs 2>&1 | Tee-Object build-evidence/license-gui/acceptance.log
          } else {
            node scripts/qualify-license-gui.mjs 2>&1 | Tee-Object build-evidence/license-gui/acceptance.log
          }
          exit $LASTEXITCODE
      - name: Publish only the qualified reusable Admin setup
        if: env.AZWAH_QA_STARTUP_ONLY != '1'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $name='Azwah-License-Admin-Setup-x64.exe'
          $dir='release-license-admin'
          $installer=Join-Path $dir $name
          $hash=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $size=(Get-Item $installer).Length
          $signature=(Get-AuthenticodeSignature -LiteralPath $installer).Status
          $run="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          "$hash  $name" | Set-Content -Encoding ascii "$dir/SHA256SUMS.txt"
          @(
            "Source: $env:AZWAH_ADMIN_BUILD_SHA"
            "Acceptance source: $env:GITHUB_SHA"
            "Installer: $name"
            "Bytes: $size"
            "SHA256: $hash"
            "Authenticode: $signature"
            "Evidence: $run"
          ) | Set-Content "$dir/BUILD-MANIFEST.txt"
          @"
          # Azwah License Admin — Experimental

          Install the Admin EXE, create your organization, choose a master password and save the encrypted backup. Open **Office Installer**, choose a version and output directory, then select **Generate Office Installer**. The bundled employee application and installer compiler work locally. Keep the encrypted vault and password under administrator control.

          Install the locally generated Office EXE with Windows administrator approval. The employee opens Office, copies their device code, then imports the license generated in the Admin GUI. Normal activation is offline. Firefox requires a system installation. Chromium is included.

          The downloadable Admin setup contains no production issuer identity. The GUI generates one locally. No disposable Office installer or employee license is included in this release. Ordinary Windows users cannot replace the trust root installed under Program Files. Users with local administrative control can modify unsigned software and installed files.

          Windows Server 2022 x64 qualification used separate Windows accounts on one host. Windows 10 and legacy installed-product upgrade were not qualified. This is an experimental installer. Authenticode status: **$signature**. Windows may warn about an unsigned installer.

          Source: $env:AZWAH_ADMIN_BUILD_SHA
          Windows evidence: $run
          "@ | Set-Content "$dir/RELEASE-NOTES.md"
          $tag='azwah-license-admin-experimental.1'
          gh release create $tag $installer "$dir/SHA256SUMS.txt" "$dir/BUILD-MANIFEST.txt" "$dir/RELEASE-NOTES.md" --repo $env:GITHUB_REPOSITORY --target $env:AZWAH_ADMIN_BUILD_SHA --draft --prerelease --title 'Azwah License Admin — Experimental' --notes-file "$dir/RELEASE-NOTES.md"
          if ($LASTEXITCODE -ne 0) { throw 'Could not create a new release' }
          $verify=Join-Path $env:RUNNER_TEMP 'admin-release-verification'
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $name --dir $verify
          if ($LASTEXITCODE -ne 0) { throw 'Draft download failed' }
          if ((Get-FileHash (Join-Path $verify $name) -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) { throw 'Draft checksum mismatch' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --prerelease
          exit $LASTEXITCODE
      - name: Preserve acceptance logs only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-gui-acceptance
          path: build-evidence/license-gui
