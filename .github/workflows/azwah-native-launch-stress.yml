name: AZWAH Chromium launch stress
# Measures how often the first browser launch of a fresh test process fails (it failed early in 2 of the first 8 test
# starts in live run 46016406470). Each iteration is a cold node process running the real launch test once, with
# Chromium's own log captured. Manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: 'Chromium chain run whose AZWAH Chromium archive is tested'
        required: false
        default: '45997594665'
      iterations:
        description: 'Cold launch iterations (alternating HTTP and SOCKS5 proxies)'
        required: false
        default: '16'
permissions:
  contents: read
  actions: read
jobs:
  stress:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NATIVE_RUN: '45997594665'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the AZWAH Chromium archive
        uses: actions/download-artifact@v4
        with:
          pattern: azwah-chromium-win64-*
          run-id: ${{ inputs.native_run_id || env.NATIVE_RUN }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/azwah-chromium
          merge-multiple: true
      - name: Unpack, verify and let the sandbox read the browser folder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'azwah-chromium') -Filter 'azwah-chromium-win64.zip' | Select-Object -First 1
          Write-Output "AZWAH_CHROMIUM_ARCHIVE bytes=$($zip.Length) sha256=$((Get-FileHash -LiteralPath $zip.FullName).Hash.ToLowerInvariant())"
          $dir = Join-Path $env:RUNNER_TEMP 'azwah-browser'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $dir
          node scripts/native-artifact.mjs verify $dir (Join-Path $dir 'AZWAH-NATIVE-MANIFEST.json')
          if ($LASTEXITCODE -ne 0) { throw 'Manifest verification failed.' }
          & "$env:SystemRoot/System32/icacls.exe" $dir /grant '*S-1-15-2-1:(OI)(CI)(RX)' '*S-1-15-2-2:(OI)(CI)(RX)' /T /C /Q | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not grant sandbox read access.' }
          $exe = Join-Path $dir 'chrome.exe'
          "AZWAH_NATIVE_CHROMIUM_EXE=$exe" | Add-Content $env:GITHUB_ENV
          "AZWAH_NATIVE_CHROMIUM_SHA256=$((Get-FileHash -LiteralPath $exe).Hash.ToLowerInvariant())" | Add-Content $env:GITHUB_ENV
          "AZWAH_NATIVE_CHROMIUM_DLL_SHA256=$((Get-FileHash -LiteralPath (Join-Path $dir 'chrome.dll')).Hash.ToLowerInvariant())" | Add-Content $env:GITHUB_ENV
          # Fingerprint features are tested only when this build's own manifest says it has them.
          $m = Get-Content -Raw (Join-Path $dir 'BASELINE-MANIFEST.json') | ConvertFrom-Json
          Write-Output "BUILD_FEATURES dchecks=$($m.dchecks) canvas=$([bool]$m.canvasPatchSha256) identity=$([bool]$m.identityPatchSha256)"
          if ($m.canvasPatchSha256) { 'AZWAH_NATIVE_CHROMIUM_CANVAS=1' | Add-Content $env:GITHUB_ENV }
          if ($m.identityPatchSha256) { 'AZWAH_NATIVE_CHROMIUM_IDENTITY=1' | Add-Content $env:GITHUB_ENV }
          if ($m.audioScreenPatchSha256) { 'AZWAH_NATIVE_CHROMIUM_AUDIO_SCREEN=1' | Add-Content $env:GITHUB_ENV }
          if ($m.gpuFontsPatchSha256) { 'AZWAH_NATIVE_CHROMIUM_GPU_FONTS=1' | Add-Content $env:GITHUB_ENV }
          if ($m.rectsUaPatchSha256) { 'AZWAH_NATIVE_CHROMIUM_RECTS_UA=1' | Add-Content $env:GITHUB_ENV }
          if ($m.mediaWebrtcPatchSha256) { 'AZWAH_NATIVE_CHROMIUM_MEDIA_WEBRTC=1' | Add-Content $env:GITHUB_ENV }
          if ($m.workersPatchSha256) { 'AZWAH_NATIVE_CHROMIUM_WORKERS=1' | Add-Content $env:GITHUB_ENV }
      - name: Install dependencies and proxy-location data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/fetch-dbip-lite.mjs
          exit $LASTEXITCODE
      - name: Cold launch iterations
        shell: pwsh
        env:
          ITERATIONS: ${{ inputs.iterations || '16' }}
        run: ./scripts/native-launch-stress.ps1 -Iterations ([int]$env:ITERATIONS)
      - name: Keep the Chromium logs of the iterations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azwah-launch-stress-logs
          path: ${{ runner.temp }}/stress-*
          retention-days: 3
          if-no-files-found: ignore
