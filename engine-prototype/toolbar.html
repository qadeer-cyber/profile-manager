<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<title>Azwah Privacy Engine</title>
<style>
body { margin: 0; padding: 6px; font: 13px system-ui; color: #182437; background: #e8edf4; }
form, #tabs { display: flex; align-items: center; gap: 4px; margin: 0 0 4px; }
#tabs { overflow-x: auto; }
#address { flex: 1; min-width: 0; }
button, input { font: inherit; }
#status { margin: 0; }
</style>
<script src="./toolbar.js" defer></script>
</head>
<body>
<div id="tabs" aria-label="Browser tabs"></div>
<form id="navigation">
<button type="button" data-action="back">Back</button><button type="button" data-action="forward">Forward</button><button type="button" data-action="reload">Reload</button>
<button type="button" data-action="new">New tab</button><button type="button" data-action="close">Close tab</button>
<input id="address" aria-label="Address" type="text" autocomplete="off" spellcheck="false"><button>Go</button>
</form>
<p id="status" role="status"></p>
</body></html>
